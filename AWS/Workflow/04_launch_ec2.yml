---
- name: Creating an EC2 Instance with Creating a VPC and Subnet Id
  hosts: localhost
  tasks:
    - name: Launch an EC2 Instance
      amazon.aws.ec2_instance:
        name: "Test-Ansible2"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        count: 2
        wait: yes
        aws_region: "{{ region }}"
        network:
          assign_public_ip: true
        image_id: "{{ ami }}"
