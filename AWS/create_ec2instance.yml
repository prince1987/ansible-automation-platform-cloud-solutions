---
- name: Launch EC2 instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: us-east-2
    instance_name: demo-ec2-from-aap
    instance_type: t3.micro
    image_id: ami-0abcdef1234567890   # replace with valid AMI in your region
    key_name: Ec2-RDS-key              # must exist in AWS or create via module
    subnet_id: subnet-045c7d6cdec2a1def       # optional: place in specific subnet
    security_group: sg-0489cd7be9f0e22d8
    tags:
      Name: "{{ instance_name }}"
  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ image_id }}"
        key_name: "{{ key_name }}"
        subnet_id: "{{ subnet_id }}"
        vpc_security_group_ids:
          - "{{ security_group }}"
        count: 1
        wait: true
        assign_public_ip: true
        tags: "{{ tags }}"
      register: ec2

    - name: Show instance details
      debug:
        var: ec2
